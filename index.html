<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heart Animation</title>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #050505;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .music-btn {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
        padding: 10px 15px;
        border-radius: 8px;
        cursor: pointer;
        backdrop-filter: blur(5px);
        z-index: 10;
        font-size: 14px;
        font-weight: bold;
        transition: background 0.3s;
      }
      .music-btn:hover {
        background: rgba(255, 255, 255, 0.25);
      }
      .settings-btn {
        position: absolute;
        top: 20px;
        right: 20px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
        padding: 10px 15px;
        border-radius: 8px;
        cursor: pointer;
        backdrop-filter: blur(5px);
        z-index: 10;
        font-size: 16px;
        transition: background 0.3s;
      }
      .settings-btn:hover {
        background: rgba(255, 255, 255, 0.25);
      }
      .panel {
        position: absolute;
        top: 70px;
        right: 20px;
        background: rgba(20, 20, 20, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.15);
        padding: 20px;
        border-radius: 12px;
        backdrop-filter: blur(10px);
        z-index: 10;
        color: white;
        display: none;
        width: 250px;
      }
      .panel.active {
        display: block;
      }
      .panel label {
        display: block;
        margin-bottom: 5px;
        font-size: 13px;
        color: #ddd;
      }
      .panel input,
      .panel select {
        width: 100%;
        padding: 8px;
        margin-bottom: 15px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
        border-radius: 6px;
      }
      .panel button {
        width: 100%;
        padding: 10px;
        background: #ff3366;
        border: none;
        color: white;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
      }
      .panel button:hover {
        background: #ff194d;
      }
    </style>
  </head>
  <body>
    <button class="music-btn" id="musicBtn" onclick="toggleMusic()">
      🎵 Play Musik
    </button>
    <button class="settings-btn" onclick="togglePanel()">⚙️</button>

    <div class="panel" id="settingsPanel">
      <label>Teks Utama (Tengah):</label>
      <input type="text" id="mainTextInput" value="Sayang" />

      <label>Teks Partikel:</label>
      <input type="text" id="particleTextInput" value="I Love You" />

      <label>Tema Warna:</label>
      <select id="themeSelect">
        <option value="red">Crimson Red</option>
        <option value="pink">Soft Pink</option>
        <option value="violet">Neon Violet</option>
      </select>

      <button onclick="applySettings()">Terapkan & Ulangi</button>
    </div>

    <canvas id="heartCanvas"></canvas>

    <script>
      const canvas = document.getElementById("heartCanvas");
      const ctx = canvas.getContext("2d");

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener("resize", resize);
      resize();

      let config = {
        mainText: "Sayang",
        particleText: "I Love You",
        theme: "red",
      };

      const musicBtn = document.getElementById("musicBtn");
      let isPlaying = false;
      function toggleMusic() {
        if (isPlaying) {
          musicBtn.innerText = "🎵 Play Musik";
          isPlaying = false;
          alert("Musik dijeda (Mode Animasi Utama Aktif)");
        } else {
          musicBtn.innerText = "🔇 Pause Musik";
          isPlaying = true;
          alert("Musik aktif!");
        }
      }

      function togglePanel() {
        const panel = document.getElementById("settingsPanel");
        panel.classList.toggle("active");
      }

      function applySettings() {
        config.mainText = document.getElementById("mainTextInput").value;
        config.particleText =
          document.getElementById("particleTextInput").value;
        config.theme = document.getElementById("themeSelect").value;
        togglePanel();
        initParticles();
      }

      let particles = [];
      const particleCount = 350;

      function getHeartPoint(t) {
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = -(
          13 * Math.cos(t) -
          5 * Math.cos(2 * t) -
          2 * Math.cos(3 * t) -
          Math.cos(4 * t)
        );
        return { x, y };
      }

      class Particle {
        constructor() {
          this.reset();
        }
        reset() {
          this.t = Math.random() * Math.PI * 2;
          let p = getHeartPoint(this.t);

          const scale = Math.min(canvas.width, canvas.height) / 35;
          this.destX = canvas.width / 2 + p.x * scale;
          this.destY = canvas.height / 2 + p.y * scale;

          this.x = canvas.width / 2;
          this.y = canvas.height / 2;

          this.vx = (Math.random() - 0.5) * 10;
          this.vy = (Math.random() - 0.5) * 10;
          this.alpha = Math.random() * 0.5 + 0.5;
          this.size = Math.random() * 12 + 10;
        }
        update(beatScale) {
          let p = getHeartPoint(this.t);
          const scale =
            (Math.min(canvas.width, canvas.height) / 35) * beatScale;
          this.destX = canvas.width / 2 + p.x * scale;
          this.destY = canvas.height / 2 + p.y * scale;

          this.x += (this.destX - this.x) * 0.08;
          this.y += (this.destY - this.y) * 0.08;
        }
        draw() {
          ctx.save();
          ctx.font = `${this.size}px sans-serif`;

          if (config.theme === "red") {
            ctx.fillStyle = `rgba(255, 51, 102, ${this.alpha})`;
          } else if (config.theme === "pink") {
            ctx.fillStyle = `rgba(255, 153, 204, ${this.alpha})`;
          } else {
            ctx.fillStyle = `rgba(180, 100, 255, ${this.alpha})`;
          }

          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(config.particleText, this.x, this.y);
          ctx.restore();
        }
      }

      function initParticles() {
        particles = [];
        for (let i = 0; i < particleCount; i++) {
          particles.push(new Particle());
        }
      }
      initParticles();

      let time = 0;
      function animate() {
        ctx.fillStyle = "rgba(5, 5, 5, 0.15)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        time += 0.05;
        let beatScale = 1 + Math.sin(time * 2) * 0.07;

        particles.forEach((p) => {
          p.update(beatScale);
          p.draw();
        });

        ctx.save();
        ctx.font = "bold 42px sans-serif";
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.shadowColor =
          config.theme === "red"
            ? "#ff3366"
            : config.theme === "pink"
              ? "#ff99cc"
              : "#b464ff";
        ctx.shadowBlur = 20;
        ctx.fillText(config.mainText, canvas.width / 2, canvas.height / 2);
        ctx.restore();

        requestAnimationFrame(animate);
      }
      animate();
    </script>
  </body>
</html>
