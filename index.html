<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heart Word Cloud Animation</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Elegant Serif & Clean Sans Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap"
      rel="stylesheet"
    />

    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #050505;
        overflow: hidden;
        font-family: "Inter", sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }

      #heartCanvas {
        display: block;
        width: 100vw;
        height: 100vh;
        cursor: pointer;
      }

      .serif-centerpiece {
        font-family: "Playfair Display", Georgia, serif;
      }

      /* Custom subtle scrollbar for panel if needed */
      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 9999px;
      }
    </style>
  </head>
  <body class="bg-[#050505] text-white relative">
    <!-- Main Interactive Canvas -->
    <canvas id="heartCanvas"></canvas>

    <!-- Subtle Floating Controls Trigger -->
    <div
      id="uiContainer"
      class="fixed top-4 right-4 z-30 flex flex-col items-end transition-opacity duration-500"
    >
      <!-- Toggle Button -->
      <button
        id="toggleSettingsBtn"
        aria-label="Pengaturan Animasi"
        class="p-3 rounded-full bg-white/5 hover:bg-white/15 border border-white/10 backdrop-blur-md text-white/60 hover:text-white transition-all duration-300 shadow-lg focus:outline-none"
      >
        <!-- Gear / Edit Icon SVG -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-5 h-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="1.8"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
          />
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
          />
        </svg>
      </button>

      <!-- Collapsible Customization Panel -->
      <div
        id="settingsPanel"
        class="hidden mt-3 w-72 sm:w-80 rounded-2xl bg-neutral-950/85 border border-white/15 backdrop-blur-xl p-5 shadow-2xl transition-all duration-300"
      >
        <div class="flex items-center justify-between mb-4">
          <h2
            class="text-sm font-semibold tracking-wide text-white/90 uppercase"
          >
            Kustomisasi Hati
          </h2>
          <button
            id="closeSettingsBtn"
            class="text-white/40 hover:text-white text-xs p-1"
          >
            ✕
          </button>
        </div>

        <div class="space-y-4">
          <!-- Center Name Input -->
          <div>
            <label
              for="centerNameInput"
              class="block text-xs font-medium text-white/60 mb-1.5"
              >Teks Tengah (Nama)</label
            >
            <input
              type="text"
              id="centerNameInput"
              value="ssnory"
              maxlength="24"
              placeholder="Masukkan nama..."
              class="w-full px-3.5 py-2 rounded-xl bg-white/5 border border-white/10 text-sm text-white placeholder-white/30 focus:outline-none focus:border-rose-500/70 transition"
            />
          </div>

          <!-- Repeating Word Input -->
          <div>
            <label
              for="particleTextInput"
              class="block text-xs font-medium text-white/60 mb-1.5"
              >Teks Partikel Hati</label
            >
            <input
              type="text"
              id="particleTextInput"
              value="I love you"
              maxlength="20"
              placeholder="Contoh: I love you"
              class="w-full px-3.5 py-2 rounded-xl bg-white/5 border border-white/10 text-sm text-white placeholder-white/30 focus:outline-none focus:border-rose-500/70 transition"
            />
          </div>

          <!-- Color Theme Selector -->
          <div>
            <label class="block text-xs font-medium text-white/60 mb-1.5"
              >Tema Warna</label
            >
            <div class="grid grid-cols-3 gap-2">
              <button
                type="button"
                data-theme="crimson"
                class="theme-btn active py-2 px-2 rounded-xl border border-rose-500 bg-rose-500/20 text-xs font-medium text-rose-200 flex items-center justify-center gap-1.5 transition"
              >
                <span
                  class="w-2.5 h-2.5 rounded-full bg-rose-600 inline-block"
                ></span>
                Crimson
              </button>
              <button
                type="button"
                data-theme="pink"
                class="theme-btn py-2 px-2 rounded-xl border border-white/10 bg-white/5 hover:bg-white/10 text-xs font-medium text-white/70 flex items-center justify-center gap-1.5 transition"
              >
                <span
                  class="w-2.5 h-2.5 rounded-full bg-pink-400 inline-block"
                ></span>
                Pink
              </button>
              <button
                type="button"
                data-theme="violet"
                class="theme-btn py-2 px-2 rounded-xl border border-white/10 bg-white/5 hover:bg-white/10 text-xs font-medium text-white/70 flex items-center justify-center gap-1.5 transition"
              >
                <span
                  class="w-2.5 h-2.5 rounded-full bg-purple-500 inline-block"
                ></span>
                Violet
              </button>
            </div>
          </div>

          <!-- Action Buttons -->
          <div class="pt-2 flex gap-2">
            <button
              id="replayBtn"
              class="flex-1 py-2.5 px-4 rounded-xl bg-gradient-to-r from-rose-600 to-pink-600 hover:from-rose-500 hover:to-pink-500 text-white text-xs font-semibold tracking-wide shadow-lg shadow-rose-950/50 transition active:scale-95"
            >
              ↻ Putar Ulang Animasi
            </button>
          </div>
        </div>

        <p class="mt-3 text-[11px] text-white/40 text-center">
          Klik di mana saja pada layar untuk mengulang animasi mekar.
        </p>
      </div>
    </div>

    <script>
      /**
       * Romantic Heart Word Cloud Animation
       * Implements parametric heart curve filling with staggered bloom & heartbeat pulse.
       */
      const canvas = document.getElementById("heartCanvas");
      const ctx = canvas.getContext("2d");

      // UI Elements
      const uiContainer = document.getElementById("uiContainer");
      const toggleSettingsBtn = document.getElementById("toggleSettingsBtn");
      const closeSettingsBtn = document.getElementById("closeSettingsBtn");
      const settingsPanel = document.getElementById("settingsPanel");
      const centerNameInput = document.getElementById("centerNameInput");
      const particleTextInput = document.getElementById("particleTextInput");
      const replayBtn = document.getElementById("replayBtn");
      const themeBtns = document.querySelectorAll(".theme-btn");

      // Color Palettes
      const THEMES = {
        crimson: {
          glowInner: "rgba(225, 29, 72, 0.42)",
          glowMid: "rgba(159, 18, 57, 0.16)",
          centerGlow: "rgba(244, 63, 94, 0.85)",
          particles: [
            "#ff1e42",
            "#e11d48",
            "#be123c",
            "#fb7185",
            "#fda4af",
            "#ff4d6d",
            "#c9184a",
            "#ffffff",
          ],
        },
        pink: {
          glowInner: "rgba(244, 114, 182, 0.40)",
          glowMid: "rgba(219, 39, 119, 0.15)",
          centerGlow: "rgba(244, 114, 182, 0.9)",
          particles: [
            "#f472b6",
            "#ec4899",
            "#db2777",
            "#f9a8d4",
            "#fbcfe8",
            "#ff70a6",
            "#ff99c8",
            "#ffffff",
          ],
        },
        violet: {
          glowInner: "rgba(168, 85, 247, 0.42)",
          glowMid: "rgba(107, 33, 168, 0.16)",
          centerGlow: "rgba(192, 132, 252, 0.9)",
          particles: [
            "#c084fc",
            "#a855f7",
            "#9333ea",
            "#e879f9",
            "#f0abfc",
            "#d946ef",
            "#8b5cf6",
            "#ffffff",
          ],
        },
      };

      // Application State
      let state = {
        centerText: "ssnory",
        particleText: "I love you",
        theme: "crimson",
        startTime: performance.now(),
        clickPulseBoost: 0,
        particles: [],
        width: 0,
        height: 0,
        heartScale: 15,
      };

      // Particle Count Configuration (responsive)
      const PARTICLE_COUNT = window.innerWidth < 640 ? 260 : 380;

      /**
       * Parametric Heart Equation
       * x = 16 sin^3(t)
       * y = 13 cos(t) - 5 cos(2t) - 2 cos(3t) - cos(4t)
       */
      function getHeartPoint(t, scaleFactor = 1) {
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = -(
          13 * Math.cos(t) -
          5 * Math.cos(2 * t) -
          2 * Math.cos(3 * t) -
          Math.cos(4 * t)
        );
        return {
          x: x * state.heartScale * scaleFactor,
          y: y * state.heartScale * scaleFactor,
        };
      }

      /**
       * Resize canvas and recalculate responsive scale
       */
      function resizeCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        state.width = window.innerWidth;
        state.height = window.innerHeight;

        canvas.width = state.width * dpr;
        canvas.height = state.height * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        // Calculate scale so heart fits comfortably on any viewport
        const minDim = Math.min(state.width, state.height);
        state.heartScale = (minDim * 0.41) / 16.5;

        // Update existing particle targets if resized
        state.particles.forEach((p) => {
          const pos = getHeartPoint(p.t, p.radialScale);
          p.targetX = pos.x;
          p.targetY = pos.y;
        });
      }

      /**
       * Initialize / Generate word particles distributed along outline & interior
       */
      function initParticles() {
        const palette = THEMES[state.theme].particles;
        state.particles = [];

        for (let i = 0; i < PARTICLE_COUNT; i++) {
          // Distribute ~38% near outline for crisp silhouette, ~62% uniformly inside
          const isOutline = i < PARTICLE_COUNT * 0.38;
          const t = Math.random() * Math.PI * 2;

          // Square root distribution prevents clumping at the center, leaving slight breathing room around centerpiece name
          let radialScale;
          if (isOutline) {
            radialScale = 0.94 + Math.random() * 0.06;
          } else {
            // Range from 0.26 to 0.94 so center name stays legible while richly filled
            radialScale = 0.25 + 0.69 * Math.pow(Math.random(), 0.58);
          }

          const target = getHeartPoint(t, radialScale);

          // Pick color weighted toward reds/pinks with occasional crisp white highlights
          const colorIndex =
            Math.random() < 0.08
              ? palette.length - 1
              : Math.floor(Math.random() * (palette.length - 1));

          // Varied font sizes for depth
          const baseFontSize =
            state.width < 640
              ? 7.5 + Math.random() * 4.5
              : 9 + Math.random() * 6.5;

          // Subtle random tilt (-28 deg to +28 deg)
          const angle = (Math.random() - 0.5) * 0.95;

          // Staggered bloom timing based on distance from center
          const delay = 1.1 + radialScale * 1.15 + Math.random() * 0.45;
          const duration = 1.1 + Math.random() * 0.6;

          state.particles.push({
            t,
            radialScale,
            targetX: target.x,
            targetY: target.y,
            color: palette[colorIndex],
            fontSize: baseFontSize,
            angle,
            delay,
            duration,
            shimmerOffset: Math.random() * Math.PI * 2,
            shimmerSpeed: 1.5 + Math.random() * 2.0,
            driftAmpX: (Math.random() - 0.5) * 3.0,
            driftAmpY: (Math.random() - 0.5) * 3.0,
          });
        }
      }

      /**
       * Smooth cubic ease-out function
       */
      function easeOutCubic(x) {
        return 1 - Math.pow(1 - x, 3);
      }

      /**
       * Replay the full opening sequence
       */
      function triggerReplay() {
        state.startTime = performance.now();
        state.clickPulseBoost = 0;
        initParticles();
      }

      /**
       * Main Render Loop
       */
      function render(now) {
        const elapsed = (now - state.startTime) / 1000; // Seconds since start
        const cx = state.width / 2;
        const cy = state.height / 2 + state.heartScale * 1.1; // Slight vertical optical centering
        const currentTheme = THEMES[state.theme];

        // 1. Clear Dark Background (#050505)
        ctx.fillStyle = "#050505";
        ctx.fillRect(0, 0, state.width, state.height);

        // Decay interactive click pulse boost
        if (state.clickPulseBoost > 0) {
          state.clickPulseBoost = Math.max(0, state.clickPulseBoost - 0.015);
        }

        // Heartbeat rhythm (activates smoothly after bloom finishes around 2.5s)
        const beatActivation = Math.min(1, Math.max(0, (elapsed - 2.3) / 1.2));
        // Double-peak lub-dub heartbeat waveform
        const beatCycle = (elapsed * 1.15) % 1;
        const lub = Math.exp(-Math.pow((beatCycle - 0.15) / 0.08, 2));
        const dub = 0.65 * Math.exp(-Math.pow((beatCycle - 0.34) / 0.09, 2));
        const heartbeat =
          (lub + dub) * 0.042 * beatActivation + state.clickPulseBoost * 0.06;
        const pulseMultiplier = 1 + heartbeat;

        // 2. Soft Radial Light Bloom in Center (fades in 0.2s -> 1.4s)
        const glowAlpha = Math.min(1, Math.max(0, (elapsed - 0.15) / 1.3));
        if (glowAlpha > 0) {
          const glowRadius =
            Math.max(state.width, state.height) * (0.34 + heartbeat * 0.8);
          const grad = ctx.createRadialGradient(
            cx,
            cy - state.heartScale * 0.8,
            5,
            cx,
            cy - state.heartScale * 0.8,
            glowRadius,
          );

          ctx.save();
          ctx.globalAlpha = glowAlpha;
          grad.addColorStop(0, currentTheme.glowInner);
          grad.addColorStop(0.45, currentTheme.glowMid);
          grad.addColorStop(1, "rgba(5, 5, 5, 0)");
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, state.width, state.height);
          ctx.restore();
        }

        // 3. Blooming & Pulsing Word Particles (starts around 1.1s)
        const wordText = state.particleText.trim() || "I love you";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        for (let i = 0; i < state.particles.length; i++) {
          const p = state.particles[i];
          if (elapsed < p.delay) continue;

          const rawProgress = Math.min(1, (elapsed - p.delay) / p.duration);
          const progress = easeOutCubic(rawProgress);

          // Subtle organic floating drift once settled
          const driftFactor = Math.max(0, (rawProgress - 0.7) / 0.3);
          const driftX =
            Math.sin(elapsed * 1.2 + p.shimmerOffset) *
            p.driftAmpX *
            driftFactor;
          const driftY =
            Math.cos(elapsed * 1.1 + p.shimmerOffset) *
            p.driftAmpY *
            driftFactor;

          const currentX = cx + p.targetX * progress * pulseMultiplier + driftX;
          const currentY = cy + p.targetY * progress * pulseMultiplier + driftY;

          // Subtle twinkle/shimmer in opacity
          const shimmer =
            0.82 + 0.18 * Math.sin(elapsed * p.shimmerSpeed + p.shimmerOffset);
          const alpha = Math.min(1, rawProgress * 1.6) * shimmer;

          ctx.save();
          ctx.translate(currentX, currentY);
          ctx.rotate(p.angle);
          ctx.scale(0.35 + 0.65 * progress, 0.35 + 0.65 * progress);
          ctx.globalAlpha = alpha;
          ctx.font = `500 ${p.fontSize}px Inter, sans-serif`;
          ctx.fillStyle = p.color;
          ctx.fillText(wordText, 0, 0);
          ctx.restore();
        }

        // 4. Centerpiece Name Text (fades in smoothly 0.55s -> 1.65s)
        const centerAlpha = Math.min(1, Math.max(0, (elapsed - 0.55) / 1.1));
        if (centerAlpha > 0) {
          const centerLabel = state.centerText.trim() || "ssnory";
          const centerFontSize = Math.max(
            24,
            Math.min(48, state.heartScale * 2.1),
          );
          const centerScale =
            0.92 + 0.08 * easeOutCubic(centerAlpha) + heartbeat * 0.45;

          ctx.save();
          ctx.translate(cx, cy - state.heartScale * 1.1);
          ctx.scale(centerScale, centerScale);
          ctx.globalAlpha = centerAlpha;

          // Subtle dark backdrop shadow for readability over overlapping words
          ctx.shadowColor = currentTheme.centerGlow;
          ctx.shadowBlur = 22;
          ctx.font = `500 ${centerFontSize}px "Playfair Display", Georgia, serif`;
          ctx.fillStyle = "#ffffff";
          ctx.fillText(centerLabel, 0, 0);

          // Second pass for crisp white core
          ctx.shadowBlur = 8;
          ctx.fillText(centerLabel, 0, 0);
          ctx.restore();
        }

        requestAnimationFrame(render);
      }

      // --- Event Listeners & Controls ---

      // Toggle Settings Panel
      toggleSettingsBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        settingsPanel.classList.toggle("hidden");
        resetUiAutoFade();
      });

      closeSettingsBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        settingsPanel.classList.add("hidden");
      });

      // Prevent clicks inside settings panel from triggering canvas replay
      settingsPanel.addEventListener("click", (e) => {
        e.stopPropagation();
        resetUiAutoFade();
      });

      // Live Text Updates
      centerNameInput.addEventListener("input", (e) => {
        state.centerText = e.target.value;
      });

      particleTextInput.addEventListener("input", (e) => {
        state.particleText = e.target.value;
      });

      // Theme Switching
      themeBtns.forEach((btn) => {
        btn.addEventListener("click", () => {
          const selectedTheme = btn.dataset.theme;
          state.theme = selectedTheme;

          // Update button active styles
          themeBtns.forEach((b) => {
            b.classList.remove(
              "border-rose-500",
              "bg-rose-500/20",
              "text-rose-200",
              "active",
            );
            b.classList.add("border-white/10", "bg-white/5", "text-white/70");
          });
          btn.classList.remove(
            "border-white/10",
            "bg-white/5",
            "text-white/70",
          );
          btn.classList.add(
            "border-rose-500",
            "bg-rose-500/20",
            "text-rose-200",
            "active",
          );

          // Re-color existing particles seamlessly
          const palette = THEMES[state.theme].particles;
          state.particles.forEach((p) => {
            const colorIndex =
              Math.random() < 0.08
                ? palette.length - 1
                : Math.floor(Math.random() * (palette.length - 1));
            p.color = palette[colorIndex];
          });
        });
      });

      // Replay Button
      replayBtn.addEventListener("click", () => {
        triggerReplay();
      });

      // Click anywhere on canvas: replay bloom if early, or trigger heartbeat pulse / replay
      canvas.addEventListener("click", () => {
        if (!settingsPanel.classList.contains("hidden")) {
          settingsPanel.classList.add("hidden");
          return;
        }
        triggerReplay();
        resetUiAutoFade();
      });

      // Subtle auto-dimming of the gear button when idle so screen stays clean like the video
      let uiFadeTimer;
      function resetUiAutoFade() {
        uiContainer.style.opacity = "1";
        clearTimeout(uiFadeTimer);
        uiFadeTimer = setTimeout(() => {
          if (settingsPanel.classList.contains("hidden")) {
            uiContainer.style.opacity = "0.28";
          }
        }, 3500);
      }

      window.addEventListener("mousemove", resetUiAutoFade);
      window.addEventListener("touchstart", resetUiAutoFade, { passive: true });
      window.addEventListener("resize", resizeCanvas);

      // Initialize on Window Load
      window.onload = function () {
        resizeCanvas();
        initParticles();
        state.startTime = performance.now();
        resetUiAutoFade();
        requestAnimationFrame(render);
      };
    </script>
  </body>
</html>
